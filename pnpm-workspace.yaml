packages:
  - "freeform"
  - "freeform-astro"
  - "emdash-freeform-mcp"
  - "emdash-app"

# Native binary builds required by emdash-app
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20261019.1-beta
  - wrangler@4.151.3

onlyBuiltDependencies:
  - "esbuild"
  - "workerd"
