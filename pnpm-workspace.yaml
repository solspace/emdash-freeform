packages:
  - "packages/*"

# This repo is the Freeform plugin (package.json at the root) plus its
# companion packages under packages/. The EmDash demo/test site lives
# outside this repo at ../cms and consumes the plugin via file: links.

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20261019.1-beta
  - wrangler@4.151.3

onlyBuiltDependencies:
  - "esbuild"
  - "workerd"
